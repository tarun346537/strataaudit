[strataaudit]
seed = 7
verification_fraction = 0.25
tolerance = 0.45
log_level = "INFO"
device = "cuda"
output_dir = "outputs"
judge_url = "http://127.0.0.1:8001/v1"
challenger_url = "http://127.0.0.1:8000/v1"
http_timeout = 60.0
http_retries = 2
retry_backoff = 0.5
breaker_failures = 3
breaker_reset = 30.0
tracking = "json"
early_stopping_patience = 3
train_steps = 500
lora_rank = 16
max_length = 2048
learning_rate = 0.00005
gradient_accumulation_steps = 4
dpo_beta = 0.1
lora_dropout = 0.05
audit_budget_units = 100
judge_cost = 1
challenger_cost = 1
verification_cost = 4
escalation_confidence = 0.9
verification_reserve = 0.4
