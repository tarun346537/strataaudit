name: Audit quality and nightly benchmark

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      COVERAGE_FILE: outputs/.coverage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/research.txt
      - name: Install CPU research dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,calibration]' -c constraints/research.txt
      - name: Check source and types
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy strataaudit
      - name: Run tests and record coverage
        run: python -m pytest -q --cov=strataaudit --cov-report=term --cov-report=xml:outputs/coverage.xml --junitxml=outputs/pytest.xml
      - name: Enforce nightly benchmark limits
        run: python -m strataaudit.regression_gate --output outputs/regression-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit-test-and-benchmark-reports
          path: outputs/
          if-no-files-found: warn
