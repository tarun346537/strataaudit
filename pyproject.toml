[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "strataaudit"
version = "0.1.0"
description = "Evidence-constrained geological hypothesis audit research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = ["numpy==2.4.4"]

[project.optional-dependencies]
calibration = ["torch==2.11.0"]
training = [
    "torch==2.11.0",
    "transformers==5.7.0",
    "huggingface-hub==1.13.0",
    "trl==1.3.0",
    "peft==0.19.1",
    "datasets==4.8.5",
    "accelerate==1.13.0",
]
gempy = ["gempy==2025.2.0", "gempy-engine==2025.2.0"]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "transformers==5.7.0",
]

[tool.setuptools.packages.find]
include = ["strataaudit*"]

[tool.strataaudit.integrations]
feedback = "RLAIF preference supervision with TRL DPO and PEFT LoRA adapters"
judge = "vLLM serving environment pinned in constraints/vllm-server.txt"
automation = "GitHub Actions (.github/workflows/evaluate.yml)"
geological_inputs = "USGS drill-core interval logs and GemPy worlds"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: exercises model, solver, or service boundaries",
    "gpu: requires a CUDA-capable training or serving environment",
]

[tool.coverage.run]
source = ["strataaudit"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["outputs", "data", ".build-temp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
files = ["strataaudit"]
strict = true
ignore_missing_imports = true
follow_imports = "silent"
untyped_calls_exclude = ["torch", "transformers", "trl", "peft", "gempy"]
